server:
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://github.com/fredo1975/spring-cloud-server-config.git
          skipSslValidation: true
          clone-on-start: true
          default-label: master
          timeout: 10
          force-pull: true
