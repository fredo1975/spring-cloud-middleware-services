services:
  localhost:
    image: alpine:latest
    command: sleep infinity
    ports:
      - "8080:8080" # Keycloak port
      - "7443:7443" # Keycloak https port
      - "5432:5432" # PostgreSQL port
      - "8083:8083" # dvdtheque-service port
      - "5005:5005" # dvdtheque-service debug port
      - "8087:8087" # dvdtheque-allocine-service port
      - "5007:5007" # dvdtheque-allocine-service debug port
      - "8089:8089" # dvdtheque-batch-service port
      - "5009:5009" # dvdtheque-batch-service debug port
      - "8086:8086" # dvdtheque-tmdb-service port
      - "5006:5006" # dvdtheque-tmdb-service debug port
      - "8761:8761" # discovery-service port
      - "8762:8762" # api-gateway-service port
      - "8888:8888" # config-service port
      - "61613:61613" # stomp relay port
      - "61614:61614" # stomp relay port
      - "9090:9090" # Port Prometheus
      - "3000:3000" # Port Grafana
      - "8161:8161" # ActiveMQ Web Console
      - "61616:61616" # ActiveMQ Broker Port

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: password
      POSTGRES_DB: keycloak
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    network_mode: "service:localhost"
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/keycloak
      KC_DB_USERNAME: sa
      KC_DB_PASSWORD: password
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 15
    command: ["start-dev", "--http-port", "8080", "--https-port", "7443", "--import-realm"]
    volumes:
      - keycloak:/opt/keycloak/data/
      - ./keycloak:/opt/keycloak/data/import:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:localhost"
    restart: always

  config-service:
    build:
      context: ./config-service
    container_name: config-service
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - TZ=Europe/Paris
    network_mode: "service:localhost"

  discovery-service:
    build:
      context: ./discovery-service
    container_name: discovery-service
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - TZ=Europe/Paris
    depends_on:
      config-service:
        condition: service_healthy
    network_mode: "service:localhost"

  api-gateway-service:
    build:
      context: ./api-gateway-service
    container_name: api-gateway-service
    environment:
      - TZ=Europe/Paris
    depends_on:
      discovery-service:
        condition: service_healthy
    network_mode: "service:localhost"

  dvdtheque-service:
    build:
      context: .
      dockerfile: dvdtheque-service/Dockerfile
    container_name: dvdtheque-service
    environment:
      - TZ=Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    network_mode: "service:localhost"

  tmdb-service:
    build:
      context: .
      dockerfile: dvdtheque-tmdb-service/Dockerfile
    container_name: dvdtheque-tmdb-service
    environment:
      - TZ=Europe/Paris
    depends_on:
      discovery-service:
        condition: service_healthy
    network_mode: "service:localhost"

  allocine-service:
    build:
      context: .
      dockerfile: dvdtheque-allocine-service/Dockerfile
    container_name: dvdtheque-allocine-service
    environment:
      - TZ=Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    network_mode: "service:localhost"

  batch-service:
    build:
      context: .
      dockerfile: dvdtheque-batch-service/Dockerfile
    container_name: dvdtheque-batch-service
    environment:
      - TZ=Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    network_mode: "service:localhost"

  activemq:
    image: apache/activemq:latest
    container_name: activemq
    environment:
      - ACTIVEMQ_ADMIN_PASSWORD=admin
      - ACTIVEMQ_ADMIN_USERNAME=admin
      - TZ=Europe/Paris
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8161/admin/", "--output", "/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./activemq-config/activemq.xml:/opt/apache-activemq/conf/activemq.xml:ro
    depends_on:
      - localhost
    network_mode: "service:localhost"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    environment:
      - TZ=Europe/Paris
    depends_on:
      - dvdtheque-service
    network_mode: "service:localhost"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=Europe/Paris
    depends_on:
      - prometheus
    network_mode: "service:localhost"

volumes:
  keycloak:
  pgdata: